<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Document state machine</title>
  <desc id="desc">State transitions for a document record: pending to uploaded to confirmed, with branches to failed from pending, and deleted from confirmed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4858"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c07070"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18313f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="960" height="320" fill="#f7f4ee"/>

  <text x="480" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#20313a">Document record states</text>
  <text x="480" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">Only confirmed records are served to end users</text>

  <!-- Happy path boxes (y=96-160) -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="140" height="60" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="110" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#20313a">pending</text>
    <text x="110" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#53646d">upload started</text>
  </g>
  <line x1="180" y1="130" x2="240" y2="130" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="210" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#53646d">stored</text>

  <g filter="url(#shadow)">
    <rect x="240" y="100" width="140" height="60" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="310" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#20313a">uploaded</text>
    <text x="310" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#53646d">bytes in storage</text>
  </g>
  <line x1="380" y1="130" x2="440" y2="130" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="410" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#53646d">validated</text>

  <g filter="url(#shadow)">
    <rect x="440" y="100" width="140" height="60" rx="8" fill="#e7efe8" stroke="#7a9a7e" stroke-width="2"/>
    <text x="510" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#34533a">confirmed</text>
    <text x="510" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34533a">served to users</text>
  </g>
  <line x1="580" y1="130" x2="640" y2="130" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="610" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#53646d">deleted</text>

  <g filter="url(#shadow)">
    <rect x="640" y="100" width="140" height="60" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="710" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#20313a">deleted</text>
    <text x="710" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#53646d">awaiting cleanup</text>
  </g>

  <!-- Failed branch from pending -->
  <line x1="110" y1="160" x2="110" y2="220" stroke="#c07070" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="110" y1="220" x2="240" y2="220" stroke="#c07070" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="175" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c07070">storage fails</text>

  <g filter="url(#shadow)">
    <rect x="240" y="196" width="140" height="60" rx="8" fill="#f2ddd3" stroke="#c07070" stroke-width="2"/>
    <text x="310" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8b3030">failed</text>
    <text x="310" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b3030">needs retry or review</text>
  </g>

  <!-- Failed branch from uploaded -->
  <line x1="310" y1="160" x2="310" y2="196" stroke="#c07070" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-red)"/>
  <text x="335" y="182" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c07070">validation fails</text>

  <!-- Bottom callout -->
  <rect x="72" y="264" width="816" height="36" rx="8" fill="#e7efe8" stroke="#7a9a7e"/>
  <text x="480" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#34533a">Pending records older than expected are visible to reconciliation; confirmed records are the only ones served</text>
</svg>
