<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Probe admission across two replicas</title>
  <desc id="desc">Two replicas attempt a probe against the same open breaker. The first replica's call performs the transition to half-open and claims the only probe slot. The second replica is rejected because the slot is taken. When the first probe succeeds, the breaker closes and the probe set is cleared.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4858"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c37a68"/>
    </marker>
    <marker id="arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a9a7e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18313f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="#f7f4ee"/>

  <text x="480" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#20313a">One probe slot, two replicas asking for it</text>
  <text x="480" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">The transition to half-open and the claim on the slot happen in the same script run</text>

  <g filter="url(#shadow)">
    <rect x="52" y="108" width="164" height="52" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="134" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#20313a">replica A</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="398" y="108" width="164" height="52" rx="8" fill="#eef2f4" stroke="#2f4858" stroke-width="2"/>
    <text x="480" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#20313a">coordinator</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="744" y="108" width="164" height="52" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="826" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#20313a">replica B</text>
  </g>

  <line x1="134" y1="160" x2="134" y2="536" stroke="#b9c1c7" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="480" y1="160" x2="480" y2="536" stroke="#b9c1c7" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="826" y1="160" x2="826" y2="536" stroke="#b9c1c7" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="396" y="186" width="168" height="30" rx="6" fill="#f4e4df" stroke="#c37a68" stroke-width="2"/>
  <text x="480" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7b3b2e">open, period elapsed</text>

  <line x1="138" y1="252" x2="470" y2="252" stroke="#2f4858" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#53646d">admit probe</text>

  <rect x="372" y="268" width="216" height="46" rx="6" fill="#fff7dd" stroke="#c6a548" stroke-width="2"/>
  <text x="480" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#725b18">half-open, probe set cleared</text>
  <text x="480" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#725b18">token A stored with deadline</text>

  <line x1="470" y1="336" x2="142" y2="336" stroke="#7a9a7e" stroke-width="2.5" marker-end="url(#arrowgreen)"/>
  <text x="300" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#34533a">admitted</text>

  <line x1="822" y1="380" x2="490" y2="380" stroke="#2f4858" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="660" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#53646d">admit probe</text>

  <line x1="490" y1="422" x2="818" y2="422" stroke="#c37a68" stroke-width="2.5" marker-end="url(#arrowred)"/>
  <text x="660" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7b3b2e">rejected, slot taken</text>

  <line x1="138" y1="470" x2="470" y2="470" stroke="#2f4858" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#53646d">settle probe: success</text>

  <rect x="386" y="486" width="188" height="46" rx="6" fill="#e7efe8" stroke="#7a9a7e" stroke-width="2"/>
  <text x="480" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#34533a">closed, generation moves</text>
  <text x="480" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34533a">remaining tokens discarded</text>

  <text x="480" y="572" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#53646d">A token that outlives its deadline is pruned before the next count, so a dead replica cannot hold a slot forever</text>
</svg>
