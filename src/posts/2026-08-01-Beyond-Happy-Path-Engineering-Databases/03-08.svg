<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Schema change during live rollout</title>
  <desc id="desc">Version A, Version B, and a backfill worker all interact with a schema in transition, showing why migration order and compatibility matter.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4858"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45f45"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18313f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="960" height="430" fill="#f7f4ee"/>

  <text x="480" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#20313a">Schema rollout happens on a live system</text>
  <text x="480" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">Old code, new code, and backfill jobs can all touch the same tables</text>

  <g filter="url(#shadow)">
    <rect x="90" y="110" width="230" height="64" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="205" y="141" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#20313a">App Version A</text>
    <text x="205" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#53646d">old read/write shape</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="204" width="230" height="64" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="205" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#20313a">App Version B</text>
    <text x="205" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#53646d">new read/write shape</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="298" width="230" height="64" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="205" y="329" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#20313a">Backfill Worker</text>
    <text x="205" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#53646d">updates old rows</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="150" width="350" height="170" rx="10" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="695" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#20313a">Schema In Transition</text>
    <text x="545" y="214" font-family="Arial, sans-serif" font-size="14" fill="#53646d">- new nullable column added</text>
    <text x="545" y="238" font-family="Arial, sans-serif" font-size="14" fill="#53646d">- dual reads during rollout</text>
    <text x="545" y="262" font-family="Arial, sans-serif" font-size="14" fill="#53646d">- backfill running in batches</text>
    <text x="545" y="286" font-family="Arial, sans-serif" font-size="14" fill="#53646d">- constraint not enforced yet</text>
  </g>

  <line x1="328" y1="142" x2="510" y2="188" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="328" y1="236" x2="510" y2="236" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="328" y1="330" x2="510" y2="284" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="715" y1="322" x2="715" y2="372" stroke="#b45f45" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-warn)"/>
  <text x="715" y="403" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#7a2f23">enforce + cleanup only after compatibility</text>
</svg>
