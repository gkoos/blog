<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Ambiguous commit outcome after timeout</title>
  <desc id="desc">The application sends a commit, times out waiting for a response, and cannot immediately tell whether the write committed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4858"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45f45"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18313f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="960" height="430" fill="#f7f4ee"/>

  <text x="480" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#20313a">Timeout does not tell you commit state</text>
  <text x="480" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">The caller lost the conversation, not necessarily the write</text>

  <g filter="url(#shadow)">
    <rect x="120" y="132" width="260" height="72" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="250" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#20313a">Application</text>
    <text x="250" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#53646d">send commit request</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="580" y="132" width="260" height="72" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="710" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#20313a">Database</text>
    <text x="710" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#53646d">process write</text>
  </g>

  <line x1="390" y1="168" x2="570" y2="168" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#53646d">commit</text>

  <line x1="570" y1="196" x2="390" y2="196" stroke="#b45f45" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-warn)"/>
  <text x="480" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#b45f45">response delayed or lost</text>

  <g filter="url(#shadow)">
    <rect x="120" y="244" width="260" height="66" rx="8" fill="#f2ddd3" stroke="#b45f45" stroke-width="2"/>
    <text x="250" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7a2f23">caller times out</text>
    <text x="250" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7a2f23">status unknown</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="580" y="244" width="260" height="66" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="710" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#20313a">actual state</text>
    <text x="710" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#53646d">could be commit or reject</text>
  </g>

  <g>
    <rect x="80" y="336" width="800" height="50" rx="8" fill="#f2ddd3" stroke="#b45f45"/>
    <text x="480" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7a2f23">Recovery needs idempotency and state checks, not guesswork</text>
  </g>
</svg>
