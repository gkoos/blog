<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Slow database work spreading through checkout</title>
  <desc id="desc">A slow database query makes transactions wait, fills the connection pool, queues API requests, and leads users to retry.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4858"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18313f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="960" height="430" fill="#f7f4ee"/>

  <text x="480" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#20313a">Slow database work spreads outward</text>
  <text x="480" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">The database does not need to be down for checkout to start failing</text>

  <g filter="url(#shadow)">
    <rect x="330" y="108" width="300" height="56" rx="8" fill="#f2ddd3" stroke="#b45f45" stroke-width="2"/>
    <text x="480" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7a2f23">slow query or lock wait</text>
  </g>

  <line x1="480" y1="172" x2="480" y2="202" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="330" y="210" width="300" height="56" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="480" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#20313a">transactions stay open</text>
  </g>

  <line x1="480" y1="274" x2="480" y2="304" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="160" y="312" width="250" height="56" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="285" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#20313a">connection pool fills</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="550" y="312" width="250" height="56" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="675" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#20313a">API requests queue</text>
  </g>

  <line x1="430" y1="340" x2="525" y2="340" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M 675 374 C 675 404, 285 404, 285 374" fill="none" stroke="#b45f45" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="480" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7a2f23">timeouts and user retries add more checkout attempts</text>
</svg>
