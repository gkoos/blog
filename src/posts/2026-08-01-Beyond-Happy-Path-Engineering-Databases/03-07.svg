<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Deadlock between two valid transactions</title>
  <desc id="desc">Transaction A holds an order row and waits for inventory. Transaction B holds inventory and waits for order. The database aborts one transaction to break the deadlock.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4858"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45f45"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18313f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="960" height="430" fill="#f7f4ee"/>

  <text x="480" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#20313a">Deadlocks are normal under contention</text>
  <text x="480" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">Two correct transactions can still block each other</text>

  <line x1="120" y1="146" x2="840" y2="146" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="120" y1="254" x2="840" y2="254" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="88" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#20313a">Txn A</text>
  <text x="88" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#20313a">Txn B</text>

  <g filter="url(#shadow)">
    <rect x="160" y="108" width="190" height="74" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="255" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#20313a">lock Order row</text>
    <text x="255" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#53646d">A holds lock</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="610" y="216" width="190" height="74" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="705" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#20313a">lock Inventory</text>
    <text x="705" y="269" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#53646d">B holds lock</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="440" y="108" width="220" height="74" rx="8" fill="#f2ddd3" stroke="#b45f45" stroke-width="2"/>
    <text x="550" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7a2f23">wait for Inventory</text>
    <text x="550" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7a2f23">blocked by Txn B</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="260" y="216" width="220" height="74" rx="8" fill="#f2ddd3" stroke="#b45f45" stroke-width="2"/>
    <text x="370" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7a2f23">wait for Order row</text>
    <text x="370" y="269" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7a2f23">blocked by Txn A</text>
  </g>

  <path d="M 660 145 C 720 92, 792 176, 740 220" fill="none" stroke="#b45f45" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-warn)"/>
  <path d="M 300 253 C 240 312, 168 230, 220 182" fill="none" stroke="#b45f45" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-warn)"/>

  <g>
    <rect x="140" y="338" width="680" height="50" rx="8" fill="#f2ddd3" stroke="#b45f45"/>
    <text x="480" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7a2f23">Database aborts one transaction to break the deadlock</text>
  </g>
</svg>
