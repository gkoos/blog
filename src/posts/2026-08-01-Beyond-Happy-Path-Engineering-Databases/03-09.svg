<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Durability and recoverability are different</title>
  <desc id="desc">A current row value is durable, but recoverability depends on having enough history and a tested restore path to explain and reconstruct state.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18313f" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4858"/>
    </marker>
  </defs>

  <rect width="960" height="430" fill="#f7f4ee"/>

  <text x="480" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#20313a">Durability is not recoverability</text>
  <text x="480" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">Persisted bytes are necessary, but recovery needs explainable history</text>

  <g filter="url(#shadow)">
    <rect x="80" y="112" width="350" height="210" rx="10" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="255" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#20313a">Current Row</text>
    <text x="115" y="182" font-family="Arial, sans-serif" font-size="15" fill="#53646d">order_id: 98421</text>
    <text x="115" y="208" font-family="Arial, sans-serif" font-size="15" fill="#53646d">status: refunded</text>
    <text x="115" y="234" font-family="Arial, sans-serif" font-size="15" fill="#53646d">updated_at: 14:22:03</text>
    <text x="255" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#53646d">Durable latest value</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="530" y="112" width="350" height="210" rx="10" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="705" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#20313a">State History</text>
    <text x="560" y="182" font-family="Arial, sans-serif" font-size="14" fill="#53646d">charged  ->  13:02</text>
    <text x="560" y="206" font-family="Arial, sans-serif" font-size="14" fill="#53646d">shipped  ->  13:41</text>
    <text x="560" y="230" font-family="Arial, sans-serif" font-size="14" fill="#53646d">refund_requested  ->  14:01</text>
    <text x="560" y="254" font-family="Arial, sans-serif" font-size="14" fill="#53646d">refunded  ->  14:22</text>
    <text x="705" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#53646d">Needed for audit and recovery</text>
  </g>

  <line x1="430" y1="216" x2="520" y2="216" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#20313a">Can we explain this state?</text>

  <g>
    <rect x="80" y="368" width="800" height="50" rx="8" fill="#f2ddd3" stroke="#b45f45"/>
    <text x="480" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7a2f23">Recovery means reconstructing and verifying business state, not only restoring rows</text>
  </g>
</svg>
