<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Direct AI-generation workflow</title>
  <desc id="desc">A prompt goes to a language model, which generates two thousand words that are submitted unchanged.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="920" height="420" rx="18" fill="#f8fafc"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="310" y="36" width="300" height="70" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="460" y="80" font-size="23" font-weight="600" fill="#172033">Prompt</text>

    <line x1="460" y1="106" x2="460" y2="151" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="250" y="166" width="420" height="82" rx="12" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
    <text x="460" y="199" font-size="22" font-weight="600" fill="#172033">Language model</text>
    <text x="460" y="229" font-size="19" fill="#475569">Generates 2,000 words</text>

    <line x1="460" y1="248" x2="460" y2="293" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="285" y="308" width="350" height="76" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="460" y="354" font-size="22" font-weight="600" fill="#172033">Submitted unchanged</text>
  </g>
</svg>
