<svg xmlns="http://www.w3.org/2000/svg" width="960" height="625" viewBox="0 0 960 625" role="img" aria-labelledby="title desc">
<title id="title">One allowance shared across replicas</title><desc id="desc">Three replicas send admission commands to a single Redis string key for their common identity and receive the decisions. The entire fleet shares a burst of 20. Only admitted replicas call the partner API; Redis does not proxy the downstream calls.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2f4858"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7a9a7e"/></marker></defs>
<rect width="960" height="625" fill="#f7f4ee"/>
<g font-family="Arial, sans-serif"><text x="480" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#20313a">One allowance shared across replicas</text><text x="480" y="72" text-anchor="middle" font-size="16" font-weight="400" fill="#53646d">All replicas use the same namespace, policy, operation and scope.</text><rect x="60" y="105" width="220" height="85" rx="10" fill="#fff" stroke="#2f4858" stroke-width="2"/><text x="170" y="139" text-anchor="middle" font-size="19" font-weight="700" fill="#20313a">Replica A</text><text x="170" y="165" text-anchor="middle" font-size="14" font-weight="400" fill="#53646d">Admission request / reply</text><rect x="370" y="105" width="220" height="85" rx="10" fill="#fff" stroke="#2f4858" stroke-width="2"/><text x="480" y="139" text-anchor="middle" font-size="19" font-weight="700" fill="#20313a">Replica B</text><text x="480" y="165" text-anchor="middle" font-size="14" font-weight="400" fill="#53646d">Admission request / reply</text><rect x="680" y="105" width="220" height="85" rx="10" fill="#fff" stroke="#2f4858" stroke-width="2"/><text x="790" y="139" text-anchor="middle" font-size="19" font-weight="700" fill="#20313a">Replica C</text><text x="790" y="165" text-anchor="middle" font-size="14" font-weight="400" fill="#53646d">Admission request / reply</text><path d="M170 190 V225 H430 V279" fill="none" stroke="#2f4858" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480 190 V279" fill="none" stroke="#2f4858" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M790 190 V225 H530 V279" fill="none" stroke="#2f4858" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="260" y="285" width="440" height="135" rx="10" fill="#eef2f4" stroke="#2f4858" stroke-width="2"/><text x="480" y="317" text-anchor="middle" font-size="20" font-weight="700" fill="#20313a">Redis: one shared GCRA cell</text><text x="480" y="347" text-anchor="middle" font-size="16" font-weight="400" fill="#20313a">Read time · compare · advance tat</text><text x="480" y="378" text-anchor="middle" font-size="16" font-weight="700" fill="#34533a">rate: 100/s · burst: 20 for the whole fleet</text><text x="480" y="402" text-anchor="middle" font-size="14" font-weight="400" fill="#53646d">Replies return to the requesting replicas.</text><rect x="40" y="465" width="250" height="90" rx="10" fill="#e7efe8" stroke="#7a9a7e" stroke-width="2"/><text x="165" y="499" text-anchor="middle" font-size="18" font-weight="700" fill="#34533a">Admitted replica</text><text x="165" y="526" text-anchor="middle" font-size="14" font-weight="400" fill="#34533a">starts the downstream call</text><path d="M290 510 H380" fill="none" stroke="#7a9a7e" stroke-width="2.5" marker-end="url(#green)"/><rect x="390" y="465" width="210" height="90" rx="10" fill="#fff" stroke="#2f4858" stroke-width="2"/><text x="495" y="505" text-anchor="middle" font-size="20" font-weight="700" fill="#20313a">Partner API</text><text x="495" y="530" text-anchor="middle" font-size="14" font-weight="400" fill="#53646d">receives the call</text><rect x="660" y="465" width="260" height="90" rx="10" fill="#f4e4df" stroke="#c37a68" stroke-width="2"/><text x="790" y="499" text-anchor="middle" font-size="18" font-weight="700" fill="#7b3b2e">Rejected replica</text><text x="790" y="526" text-anchor="middle" font-size="14" font-weight="400" fill="#7b3b2e">does not call the API</text><text x="480" y="598" text-anchor="middle" font-size="15" font-weight="400" fill="#53646d">Redis grants admission; each admitted replica sends its own API request.</text></g></svg>
