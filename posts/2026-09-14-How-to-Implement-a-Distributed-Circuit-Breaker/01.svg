<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Circuit breaker state machine</title>
  <desc id="desc">A circuit breaker moves from closed to open when the failure rate crosses the threshold, from open to half-open on the first attempt after the open period, and from half-open either back to closed on enough probe successes or back to open on any probe failure.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4858"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18313f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="960" height="470" fill="#f7f4ee"/>

  <text x="480" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#20313a">The three states and the four edges between them</text>
  <text x="480" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">Recovery is only ever proved by a probe, never by the clock alone</text>

  <g filter="url(#shadow)">
    <rect x="84" y="150" width="204" height="86" rx="8" fill="#e7efe8" stroke="#7a9a7e" stroke-width="2"/>
    <text x="186" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#34533a">closed</text>
    <text x="186" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#53646d">traffic flows, outcomes recorded</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="378" y="150" width="204" height="86" rx="8" fill="#f4e4df" stroke="#c37a68" stroke-width="2"/>
    <text x="480" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#7b3b2e">open</text>
    <text x="480" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#53646d">every call rejected at once</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="672" y="150" width="204" height="86" rx="8" fill="#fff7dd" stroke="#c6a548" stroke-width="2"/>
    <text x="774" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#725b18">half-open</text>
    <text x="774" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#53646d">bounded probes admitted</text>
  </g>

  <line x1="290" y1="180" x2="372" y2="180" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="331" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#53646d">failure rate</text>
  <text x="331" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#53646d">over threshold</text>

  <line x1="584" y1="180" x2="666" y2="180" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="625" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#53646d">first attempt</text>
  <text x="625" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#53646d">after openMs</text>

  <path d="M 744 240 C 744 306, 566 306, 506 242" fill="none" stroke="#c37a68" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="625" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7b3b2e">any probe failure</text>

  <path d="M 812 240 C 812 396, 268 396, 214 242" fill="none" stroke="#7a9a7e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="512" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#34533a">enough probe successes</text>

  <text x="480" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#53646d">No other edge exists: closed never reaches half-open directly, and open never closes without a probe</text>
</svg>
