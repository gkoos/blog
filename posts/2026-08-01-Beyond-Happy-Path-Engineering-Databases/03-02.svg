<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Database serving multiple callers</title>
  <desc id="desc">Checkout traffic, admin screens, background workers, reports, and migrations all send work to the same database.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4858"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18313f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="960" height="430" fill="#f7f4ee"/>

  <g>
    <text x="480" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#20313a">The database has more than one caller</text>
    <text x="480" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">User traffic, jobs, reports, and migrations all compete for the same system</text>
  </g>

  <g transform="translate(376 128)" filter="url(#shadow)">
    <rect width="208" height="118" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="104" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#20313a">Database</text>
    <text x="104" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">tables, indexes, locks</text>
    <text x="104" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">connections, cache, disk</text>
  </g>

  <g transform="translate(70 104)" filter="url(#shadow)">
    <rect width="188" height="72" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="94" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#20313a">Checkout</text>
  </g>

  <g transform="translate(70 218)" filter="url(#shadow)">
    <rect width="188" height="72" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="94" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#20313a">Admin screens</text>
  </g>

  <g transform="translate(702 84)" filter="url(#shadow)">
    <rect width="188" height="72" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="94" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#20313a">Workers</text>
  </g>

  <g transform="translate(702 178)" filter="url(#shadow)">
    <rect width="188" height="72" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="94" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#20313a">Reports</text>
  </g>

  <g transform="translate(702 272)" filter="url(#shadow)">
    <rect width="188" height="72" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="94" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#20313a">Migrations</text>
  </g>

  <line x1="258" y1="140" x2="370" y2="164" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="258" y1="254" x2="370" y2="210" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="702" y1="120" x2="590" y2="158" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="702" y1="214" x2="590" y2="188" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="702" y1="308" x2="590" y2="222" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="126" y="366" width="708" height="42" rx="8" fill="#f2ddd3" stroke="#b45f45"/>
    <text x="480" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7a2f23">One slow path can consume capacity needed by another path</text>
  </g>
</svg>
