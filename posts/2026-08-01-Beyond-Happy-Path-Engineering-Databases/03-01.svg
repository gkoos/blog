<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Happy-path checkout database write</title>
  <desc id="desc">A checkout request checks inventory, creates an order, records a payment attempt, updates inventory, and returns a confirmation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4858"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18313f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="960" height="360" fill="#f7f4ee"/>

  <g>
    <text x="480" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#20313a">Checkout happy path</text>
    <text x="480" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">One request, current reads, fast writes, clear result</text>
  </g>

  <line x1="92" y1="168" x2="868" y2="168" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="48" y="112" width="144" height="92" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="120" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20313a">Check</text>
    <text x="120" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">inventory</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="224" y="112" width="144" height="92" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="296" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20313a">Create</text>
    <text x="296" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">order</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="400" y="112" width="160" height="92" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="480" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20313a">Record</text>
    <text x="480" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">payment attempt</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="592" y="112" width="144" height="92" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="664" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20313a">Update</text>
    <text x="664" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">inventory</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="768" y="112" width="144" height="92" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="840" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20313a">Return</text>
    <text x="840" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">confirmation</text>
  </g>

  <g>
    <rect x="126" y="252" width="708" height="50" rx="8" fill="#e7efe8" stroke="#7a9a7e"/>
    <text x="480" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#34533a">Every step sees the database as fast, current, and uncontested</text>
  </g>
</svg>
