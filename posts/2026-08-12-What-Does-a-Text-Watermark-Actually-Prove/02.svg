<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" role="img" aria-labelledby="title desc">
  <title id="title">AI-assisted editing workflow</title>
  <desc id="desc">A human writes two thousand words, a language model copy-edits the draft, the human reviews and revises it, and the result is published.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="920" height="580" rx="18" fill="#f8fafc"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="260" y="32" width="400" height="78" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="460" y="65" font-size="22" font-weight="600" fill="#172033">Human author</text>
    <text x="460" y="94" font-size="19" fill="#475569">Writes 2,000 words</text>

    <line x1="460" y1="110" x2="460" y2="150" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="260" y="165" width="400" height="78" rx="12" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
    <text x="460" y="198" font-size="22" font-weight="600" fill="#172033">Language model</text>
    <text x="460" y="227" font-size="19" fill="#475569">Copy-edits the draft</text>

    <line x1="460" y1="243" x2="460" y2="283" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="260" y="298" width="400" height="78" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="460" y="331" font-size="22" font-weight="600" fill="#172033">Human author</text>
    <text x="460" y="360" font-size="19" fill="#475569">Reviews and revises</text>

    <line x1="460" y1="376" x2="460" y2="416" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="310" y="431" width="300" height="76" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="460" y="477" font-size="22" font-weight="600" fill="#172033">Published</text>
  </g>
</svg>
