<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">The schedule and the earliest allowed arrival</title>
<desc id="desc">After a burst at time zero, TAT is 200 milliseconds. Subtracting the 190 millisecond tolerance makes 10 milliseconds the earliest eligible time. All later arrivals are eligible under this unchanged state, including arrivals after TAT.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2f4858"/></marker></defs>
<rect width="960" height="400" fill="#f7f4ee"/>
<g font-family="Arial, sans-serif" fill="#20313a">
<text x="480" y="43" text-anchor="middle" font-size="22" font-weight="700">The tolerance brings eligibility forward</text>
<text x="480" y="72" text-anchor="middle" font-size="15" fill="#53646d">State immediately after 20 admissions at time zero</text>
<rect x="65" y="155" width="103" height="70" rx="6" fill="#f4e4df"/>
<rect x="168" y="155" width="712" height="70" rx="6" fill="#e7efe8"/>
<path d="M65 237 H902" stroke="#2f4858" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M168 145 V252 M750 145 V252" stroke="#2f4858" stroke-width="2"/>
<path d="M168 137 V124 H750 V137" fill="none" stroke="#7a9a7e" stroke-width="2"/>
<text x="459" y="113" text-anchor="middle" font-size="15" fill="#34533a">Allowed earliness: τ = 190 ms</text>
<text x="116" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#7b3b2e">Reject</text>
<text x="458" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#34533a">Eligible ahead of the nominal schedule</text>
<text x="820" y="185" text-anchor="middle" font-size="14" fill="#34533a">Still eligible</text>
<text x="820" y="205" text-anchor="middle" font-size="14" fill="#34533a">after TAT</text>
<text x="137" y="276" text-anchor="end" font-size="14" fill="#53646d">0 ms</text>
<text x="185" y="276" font-size="15" font-weight="700">10 ms</text>
<text x="185" y="299" font-size="14" fill="#53646d">TAT − τ: earliest arrival</text>
<text x="750" y="276" text-anchor="middle" font-size="15" font-weight="700">200 ms</text>
<text x="750" y="299" text-anchor="middle" font-size="14" fill="#53646d">TAT: nominal schedule</text>
<path d="M137 231 V243" stroke="#2f4858" stroke-width="2"/>
<text x="480" y="365" text-anchor="middle" font-size="14" fill="#53646d">Each admission changes the state. These regions describe the decision before that update.</text>
</g></svg>
