<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">A missing key and a missing reply</title><desc id="desc">An admission script that reads a missing key uses TAT zero and admits against fresh allowance. An existing key produces a normal admit or rate-reject decision. If the caller receives no valid reply, the admission outcome is unknown and the downstream call is refused with coordinator-unavailable. Losing active state early resets its budget.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2f4858"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7a9a7e"/></marker></defs>
<rect width="960" height="600" fill="#f7f4ee"/>
<g font-family="Arial, sans-serif"><text x="480" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#20313a">A missing key and a missing reply</text><text x="480" y="72" text-anchor="middle" font-size="15" font-weight="400" fill="#53646d">An absent record has a defined value; an unanswered command has an unknown outcome.</text><rect x="305" y="105" width="350" height="65" rx="10" fill="#fff" stroke="#2f4858" stroke-width="2"/><text x="480" y="145" text-anchor="middle" font-size="19" font-weight="700" fill="#20313a">Ask Redis to admit this call</text><path d="M480 170 V207 H170 V255" fill="none" stroke="#2f4858" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480 170 V255" fill="none" stroke="#2f4858" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480 170 V207 H790 V255" fill="none" stroke="#2f4858" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="265" width="260" height="130" rx="10" fill="#e7efe8" stroke="#7a9a7e" stroke-width="2"/><text x="170" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#20313a">Script reads a missing key</text><text x="170" y="327" text-anchor="middle" font-size="15" font-weight="400" fill="#20313a">TAT defaults to 0.</text><text x="170" y="352" text-anchor="middle" font-size="14" font-weight="400" fill="#53646d">Anchor at server time.</text><text x="170" y="379" text-anchor="middle" font-size="15" font-weight="700" fill="#20313a">Fresh allowance</text><path d="M170 395 V438" fill="none" stroke="#2f4858" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="445" width="260" height="85" rx="10" fill="#e7efe8" stroke="#7a9a7e" stroke-width="2"/><text x="170" y="477" text-anchor="middle" font-size="16" font-weight="700" fill="#20313a">Admit and advance tat</text><text x="170" y="506" text-anchor="middle" font-size="14" font-weight="400" fill="#53646d">Expected after idle expiry</text><rect x="350" y="265" width="260" height="130" rx="10" fill="#eef2f4" stroke="#2f4858" stroke-width="2"/><text x="480" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#20313a">Script reads an existing key</text><text x="480" y="327" text-anchor="middle" font-size="15" font-weight="400" fill="#20313a">Compare its TAT with now.</text><text x="480" y="352" text-anchor="middle" font-size="14" font-weight="400" fill="#53646d">Use the configured burst delay.</text><text x="480" y="379" text-anchor="middle" font-size="15" font-weight="700" fill="#20313a">Known decision</text><path d="M480 395 V438" fill="none" stroke="#2f4858" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="350" y="445" width="260" height="85" rx="10" fill="#eef2f4" stroke="#2f4858" stroke-width="2"/><text x="480" y="477" text-anchor="middle" font-size="16" font-weight="700" fill="#20313a">Admit or rate-reject</text><text x="480" y="506" text-anchor="middle" font-size="14" font-weight="400" fill="#53646d">Rejection includes retryAfterMs</text><rect x="660" y="265" width="260" height="130" rx="10" fill="#f4e4df" stroke="#c37a68" stroke-width="2"/><text x="790" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#20313a">No valid reply reaches caller</text><text x="790" y="327" text-anchor="middle" font-size="15" font-weight="400" fill="#20313a">The command may have run.</text><text x="790" y="352" text-anchor="middle" font-size="14" font-weight="400" fill="#53646d">Admission is unconfirmed.</text><text x="790" y="379" text-anchor="middle" font-size="15" font-weight="700" fill="#20313a">Unknown outcome</text><path d="M790 395 V438" fill="none" stroke="#2f4858" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="660" y="445" width="260" height="85" rx="10" fill="#f4e4df" stroke="#c37a68" stroke-width="2"/><text x="790" y="477" text-anchor="middle" font-size="16" font-weight="700" fill="#20313a">Refuse the downstream call</text><text x="790" y="506" text-anchor="middle" font-size="14" font-weight="400" fill="#53646d">coordinator-unavailable</text><text x="480" y="572" text-anchor="middle" font-size="14" font-weight="400" fill="#53646d">Premature loss of an active key also resets the allowance; expiry must preserve the budget.</text></g></svg>
