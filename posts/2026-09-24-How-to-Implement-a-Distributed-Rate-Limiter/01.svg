<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">One timestamp inside one process</title><desc id="desc">At rate 100 per second and burst 3, three calls at time zero advance TAT to 30 milliseconds. A fourth call at the same time is rejected. Calls at 10 and 20 milliseconds are admitted, advancing TAT to 40 and 50 milliseconds.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2f4858"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7a9a7e"/></marker></defs>
<rect width="960" height="470" fill="#f7f4ee"/>
<g font-family="Arial, sans-serif"><text x="480" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#20313a">One timestamp inside one process</text><text x="480" y="72" text-anchor="middle" font-size="16" font-weight="400" fill="#53646d">rate: 100/s · burst: 3 · emission interval: 10 ms</text><rect x="30" y="100" width="900" height="335" rx="10" fill="#eef2f4" stroke="#b4c0c6" stroke-width="2"/><text x="55" y="133" text-anchor="start" font-size="17" font-weight="700" fill="#20313a">One process · one policy instance · one tat variable</text><rect x="55" y="175" width="190" height="160" rx="10" fill="#e7efe8" stroke="#7a9a7e" stroke-width="2"/><text x="150" y="206" text-anchor="middle" font-size="20" font-weight="700" fill="#20313a">0 ms</text><text x="150" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#20313a">3 calls admitted</text><text x="150" y="277" text-anchor="middle" font-size="15" font-weight="400" fill="#53646d">tat: 0 → 30 ms</text><text x="150" y="310" text-anchor="middle" font-size="14" font-weight="400" fill="#53646d">Initial burst</text><path d="M245 255 H269" fill="none" stroke="#2f4858" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="275" y="175" width="190" height="160" rx="10" fill="#f4e4df" stroke="#c37a68" stroke-width="2"/><text x="370" y="206" text-anchor="middle" font-size="20" font-weight="700" fill="#20313a">0 ms</text><text x="370" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#20313a">4th call rejected</text><text x="370" y="277" text-anchor="middle" font-size="15" font-weight="400" fill="#53646d">tat stays at 30 ms</text><text x="370" y="310" text-anchor="middle" font-size="14" font-weight="400" fill="#53646d">retryAfterMs: 10</text><path d="M465 255 H489" fill="none" stroke="#2f4858" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="495" y="175" width="190" height="160" rx="10" fill="#e7efe8" stroke="#7a9a7e" stroke-width="2"/><text x="590" y="206" text-anchor="middle" font-size="20" font-weight="700" fill="#20313a">10 ms</text><text x="590" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#20313a">1 call admitted</text><text x="590" y="277" text-anchor="middle" font-size="15" font-weight="400" fill="#53646d">tat: 30 → 40 ms</text><text x="590" y="310" text-anchor="middle" font-size="14" font-weight="400" fill="#53646d">Next interval</text><path d="M685 255 H709" fill="none" stroke="#2f4858" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="715" y="175" width="190" height="160" rx="10" fill="#e7efe8" stroke="#7a9a7e" stroke-width="2"/><text x="810" y="206" text-anchor="middle" font-size="20" font-weight="700" fill="#20313a">20 ms</text><text x="810" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#20313a">1 call admitted</text><text x="810" y="277" text-anchor="middle" font-size="15" font-weight="400" fill="#53646d">tat: 40 → 50 ms</text><text x="810" y="310" text-anchor="middle" font-size="14" font-weight="400" fill="#53646d">Next interval</text><text x="480" y="374" text-anchor="middle" font-size="16" font-weight="400" fill="#20313a">The burst spends the initial allowance; later calls arrive 10 ms apart.</text><text x="480" y="402" text-anchor="middle" font-size="15" font-weight="400" fill="#53646d">All decisions above update the same local timestamp.</text></g></svg>
