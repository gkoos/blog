<svg xmlns="http://www.w3.org/2000/svg" width="960" height="505" viewBox="0 0 960 505" role="img" aria-labelledby="title desc">
<title id="title">Idle time makes the stored cell disposable</title><desc id="desc">Three calls at time zero leave TAT at 30 milliseconds and set the expiry to that instant. With no further calls the key expires at 30 milliseconds. A call at 50 milliseconds reads missing state as zero, anchors at 50, and stores a new TAT of 60. Keeping the old TAT of 30 would yield the same decision.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2f4858"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7a9a7e"/></marker></defs>
<rect width="960" height="505" fill="#f7f4ee"/>
<g font-family="Arial, sans-serif"><text x="480" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#20313a">Idle time makes the stored cell disposable</text><text x="480" y="72" text-anchor="middle" font-size="16" font-weight="400" fill="#53646d">rate: 100/s · burst: 3 · times relative to the initial burst</text><rect x="145" y="116" width="360" height="68" rx="5" fill="#e7efe8" stroke="#7a9a7e" stroke-width="2"/><text x="325" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#34533a">Stored tat = 30 ms</text><text x="325" y="168" text-anchor="middle" font-size="14" font-weight="400" fill="#34533a">No further calls during this interval</text><path d="M100 204 H865" fill="none" stroke="#2f4858" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M145 192 V216" fill="none" stroke="#2f4858" stroke-width="2.5"/><text x="145" y="240" text-anchor="middle" font-size="17" font-weight="700" fill="#20313a">0 ms</text><path d="M505 192 V216" fill="none" stroke="#2f4858" stroke-width="2.5"/><text x="505" y="240" text-anchor="middle" font-size="17" font-weight="700" fill="#20313a">30 ms</text><path d="M745 192 V216" fill="none" stroke="#2f4858" stroke-width="2.5"/><text x="745" y="240" text-anchor="middle" font-size="17" font-weight="700" fill="#20313a">50 ms</text><rect x="45" y="275" width="260" height="125" rx="10" fill="#fff" stroke="#2f4858" stroke-width="2"/><text x="175" y="308" text-anchor="middle" font-size="18" font-weight="700" fill="#20313a">Burst admitted</text><text x="175" y="342" text-anchor="middle" font-size="15" font-weight="400" fill="#20313a">3 calls advance tat to 30 ms.</text><text x="175" y="368" text-anchor="middle" font-size="15" font-weight="400" fill="#53646d">Expiry is set to 30 ms.</text><rect x="350" y="275" width="260" height="125" rx="10" fill="#fff" stroke="#2f4858" stroke-width="2"/><text x="480" y="308" text-anchor="middle" font-size="18" font-weight="700" fill="#20313a">Expiry boundary</text><text x="480" y="342" text-anchor="middle" font-size="15" font-weight="400" fill="#20313a">now reaches the stored tat.</text><text x="480" y="368" text-anchor="middle" font-size="15" font-weight="400" fill="#53646d">The key can safely expire.</text><rect x="655" y="275" width="260" height="125" rx="10" fill="#fff" stroke="#2f4858" stroke-width="2"/><text x="785" y="308" text-anchor="middle" font-size="18" font-weight="700" fill="#20313a">Next call arrives</text><text x="785" y="342" text-anchor="middle" font-size="15" font-weight="400" fill="#20313a">Missing key: tat reads as 0.</text><text x="785" y="368" text-anchor="middle" font-size="15" font-weight="400" fill="#53646d">Anchor at 50; store tat = 60.</text><text x="480" y="446" text-anchor="middle" font-size="16" font-weight="400" fill="#20313a">At 50 ms, an old tat of 30 and a missing key both anchor the next call at 50.</text><text x="480" y="475" text-anchor="middle" font-size="14" font-weight="400" fill="#53646d">No admissions occur between the initial burst and the call at 50 ms.</text></g></svg>
