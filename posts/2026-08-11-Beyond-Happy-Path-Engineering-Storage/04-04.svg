<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Reference outliving the object</title>
  <desc id="desc">A timeline with two rows. The DB record row stays green across both time points. The Object row is green at Week 1 and becomes coral at Week 5 after a lifecycle policy deletes it. A user request at Week 5 returns 404.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4858"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18313f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="960" height="400" fill="#f7f4ee"/>

  <text x="480" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#20313a">Reference outliving the object</text>
  <text x="480" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">The database record and the stored object change independently</text>

  <!-- Column headers -->
  <text x="300" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#20313a">Week 1</text>
  <text x="630" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#20313a">Week 5</text>
  <line x1="148" y1="108" x2="900" y2="108" stroke="#b9c1c7" stroke-width="1"/>
  <line x1="148" y1="108" x2="148" y2="330" stroke="#b9c1c7" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="464" y1="108" x2="464" y2="330" stroke="#b9c1c7" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Lifecycle policy annotation -->
  <text x="464" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c07070">lifecycle policy fires</text>
  <line x1="464" y1="130" x2="464" y2="148" stroke="#c07070" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- DB record row (boxes y=148-222) -->
  <text x="74" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#53646d">DB record</text>
  <g filter="url(#shadow)">
    <rect x="158" y="148" width="296" height="74" rx="8" fill="#e7efe8" stroke="#7a9a7e" stroke-width="2"/>
    <text x="306" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#34533a">document-42</text>
    <text x="306" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#34533a">status: ready</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="474" y="148" width="296" height="74" rx="8" fill="#e7efe8" stroke="#7a9a7e" stroke-width="2"/>
    <text x="622" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#34533a">document-42</text>
    <text x="622" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#34533a">status: ready (unchanged)</text>
  </g>

  <!-- Object row (boxes y=242-316) -->
  <text x="74" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#53646d">Object</text>
  <g filter="url(#shadow)">
    <rect x="158" y="242" width="296" height="74" rx="8" fill="#e7efe8" stroke="#7a9a7e" stroke-width="2"/>
    <text x="306" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#34533a">/docs/document-42.pdf</text>
    <text x="306" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#34533a">bytes accessible</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="474" y="242" width="296" height="74" rx="8" fill="#f2ddd3" stroke="#c07070" stroke-width="2"/>
    <text x="622" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#8b3030">deleted</text>
    <text x="622" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#8b3030">removed by lifecycle policy</text>
  </g>

  <!-- User request arrow and 404 -->
  <line x1="774" y1="279" x2="830" y2="279" stroke="#8b3030" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="835" y="272" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#8b3030">user</text>
  <text x="835" y="289" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#8b3030">request</text>
  <text x="835" y="308" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#8b3030">→ 404</text>

  <!-- Bottom callout -->
  <rect x="72" y="332" width="816" height="36" rx="8" fill="#e7efe8" stroke="#7a9a7e"/>
  <text x="480" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#34533a">The database record persists; the URL the application still serves returns 404</text>
</svg>
