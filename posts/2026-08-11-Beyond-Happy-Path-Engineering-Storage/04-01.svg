<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Upload happy path</title>
  <desc id="desc">A user uploads a document. The upload API writes bytes to object storage and inserts a database record. A background worker picks up the record and marks the document ready.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4858"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18313f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="960" height="500" fill="#f7f4ee"/>

  <g>
    <text x="480" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#20313a">Upload happy path</text>
    <text x="480" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#53646d">One sequential flow, both systems respond, worker confirms</text>
  </g>

  <!-- User box -->
  <g filter="url(#shadow)">
    <rect x="24" y="228" width="124" height="82" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="86" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20313a">User</text>
    <text x="86" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#53646d">selects file</text>
  </g>

  <!-- Upload API box -->
  <g filter="url(#shadow)">
    <rect x="236" y="205" width="168" height="120" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="320" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20313a">Upload API</text>
    <text x="320" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#53646d">receives bytes</text>
  </g>

  <!-- Object Storage box -->
  <g filter="url(#shadow)">
    <rect x="482" y="116" width="196" height="86" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="580" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20313a">Object Storage</text>
    <text x="580" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#53646d">stores bytes at key</text>
  </g>

  <!-- Documents table box -->
  <g filter="url(#shadow)">
    <rect x="482" y="332" width="196" height="86" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="580" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20313a">Documents table</text>
    <text x="580" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#53646d">status: uploaded</text>
  </g>

  <!-- Worker box -->
  <g filter="url(#shadow)">
    <rect x="742" y="332" width="176" height="86" rx="8" fill="#ffffff" stroke="#2f4858" stroke-width="2"/>
    <text x="830" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20313a">Worker</text>
    <text x="830" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#53646d">processes · marks ready</text>
  </g>

  <!-- Arrow: User → Upload API -->
  <line x1="148" y1="269" x2="236" y2="269" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Fork stem: Upload API right edge → fork point -->
  <line x1="404" y1="265" x2="450" y2="265" stroke="#2f4858" stroke-width="3"/>

  <!-- Fork dot -->
  <circle cx="450" cy="265" r="5" fill="#2f4858"/>

  <!-- Arrow: fork → Object Storage (left center) -->
  <line x1="450" y1="265" x2="482" y2="159" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Arrow: fork → Documents table (left center) -->
  <line x1="450" y1="265" x2="482" y2="375" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Arrow: Documents table → Worker -->
  <line x1="678" y1="375" x2="742" y2="375" stroke="#2f4858" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Label: upload -->
  <rect x="152" y="226" width="80" height="26" rx="13" fill="#e7efe8" stroke="#7a9a7e"/>
  <text x="192" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#34533a">upload</text>

  <!-- Label: write bytes (upper diagonal) -->
  <rect x="418" y="213" width="116" height="26" rx="13" fill="#e7efe8" stroke="#7a9a7e"/>
  <text x="476" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#34533a">write bytes</text>

  <!-- Label: insert record (lower diagonal) -->
  <rect x="408" y="291" width="124" height="26" rx="13" fill="#e7efe8" stroke="#7a9a7e"/>
  <text x="470" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#34533a">insert record</text>

  <!-- Bottom callout -->
  <rect x="72" y="444" width="816" height="38" rx="8" fill="#e7efe8" stroke="#7a9a7e"/>
  <text x="480" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#34533a">Both systems succeed independently, the application code maintains the bond between them</text>
</svg>
